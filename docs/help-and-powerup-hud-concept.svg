<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
	<rect width="1200" height="800" fill="#050713"/>
	<g fill="#7f8ca6" opacity="0.65">
		<circle cx="42" cy="66" r="1.4"/><circle cx="154" cy="112" r="1"/><circle cx="273" cy="52" r="1.3"/>
		<circle cx="410" cy="94" r="1"/><circle cx="566" cy="42" r="1.2"/><circle cx="723" cy="119" r="1.4"/>
		<circle cx="864" cy="58" r="1"/><circle cx="1044" cy="96" r="1.4"/><circle cx="1140" cy="44" r="1"/>
		<circle cx="91" cy="715" r="1"/><circle cx="348" cy="746" r="1.3"/><circle cx="682" cy="704" r="1"/>
		<circle cx="927" cy="746" r="1.4"/><circle cx="1120" cy="690" r="1.1"/>
	</g>

	<text x="40" y="42" fill="#9bb8d1" font-family="monospace" font-size="16">PROPOSED HELP OVERLAY · 1024×768 GAMEPLAY SCALE</text>
	<rect x="40" y="62" width="760" height="690" rx="8" fill="#081021" stroke="#5ee7ff" stroke-width="2"/>
	<text x="420" y="125" text-anchor="middle" fill="#5ee7ff" font-family="monospace" font-size="34" font-weight="bold">CONTROLS</text>
	<line x1="88" y1="150" x2="752" y2="150" stroke="#31536b"/>

	<text x="98" y="190" fill="#ffcf5c" font-family="monospace" font-size="18" font-weight="bold">KEYBOARD</text>
	<g fill="#ffffff" font-family="monospace" font-size="17">
		<text x="98" y="230">LEFT / RIGHT</text><text x="285" y="230" fill="#9bb8d1">ROTATE</text>
		<text x="98" y="266">UP</text><text x="285" y="266" fill="#9bb8d1">THRUST</text>
		<text x="98" y="302">SPACE</text><text x="285" y="302" fill="#9bb8d1">FIRE</text>
		<text x="98" y="338">F</text><text x="285" y="338" fill="#9bb8d1">AUTO-FIRE</text>
		<text x="98" y="374">K</text><text x="285" y="374" fill="#9bb8d1">KID MODE</text>
		<text x="98" y="410">B</text><text x="285" y="410" fill="#9bb8d1">DEATH BLOSSOM</text>
		<text x="98" y="446">P / ESC</text><text x="285" y="446" fill="#9bb8d1">PAUSE</text>
		<text x="98" y="482">R</text><text x="285" y="482" fill="#9bb8d1">RESTART</text>
		<text x="98" y="518">F1 / H</text><text x="285" y="518" fill="#9bb8d1">HELP</text>
	</g>

	<text x="470" y="190" fill="#ffcf5c" font-family="monospace" font-size="18" font-weight="bold">POINTER</text>
	<g fill="#ffffff" font-family="monospace" font-size="17">
		<text x="470" y="230">MOVE</text><text x="610" y="230" fill="#9bb8d1">AIM</text>
		<text x="470" y="266">HOLD LEFT</text><text x="610" y="266" fill="#9bb8d1">FIRE</text>
		<text x="470" y="302">HOLD RIGHT</text><text x="610" y="302" fill="#9bb8d1">THRUST</text>
		<text x="470" y="338">SCROLL</text><text x="610" y="338" fill="#9bb8d1">BLOSSOM</text>
	</g>

	<g transform="translate(420 585)" stroke="#ff5cf4" stroke-width="2" fill="none">
		<line x1="0" y1="-18" x2="0" y2="18"/><line x1="-18" y1="0" x2="18" y2="0"/>
		<line x1="-13" y1="-13" x2="13" y2="13"/><line x1="13" y1="-13" x2="-13" y2="13"/>
		<circle r="6" fill="#ff5cf4"/>
	</g>
	<text x="420" y="636" text-anchor="middle" fill="#ffcf5c" font-family="monospace" font-size="17">ONE DEATH BLOSSOM PER LIFE</text>
	<text x="420" y="702" text-anchor="middle" fill="#6d7892" font-family="monospace" font-size="14">Two columns keep every control legible without shrinking the type.</text>

	<text x="840" y="42" fill="#9bb8d1" font-family="monospace" font-size="16">PROPOSED ACTIVE-POWER HUD</text>
	<rect x="840" y="62" width="320" height="690" rx="8" fill="#081021" stroke="#283a59"/>
	<text x="870" y="112" fill="#6d7892" font-family="monospace" font-size="14">NORMAL HUD CONTEXT</text>
	<text x="870" y="154" fill="#9bb8d1" font-family="monospace" font-size="18">SCORE</text>
	<text x="870" y="182" fill="#ffffff" font-family="monospace" font-size="24">084250</text>
	<text x="1040" y="154" fill="#9bb8d1" font-family="monospace" font-size="18">LEVEL</text>
	<text x="1070" y="182" fill="#ffffff" font-family="monospace" font-size="24">12</text>

	<text x="870" y="252" fill="#6d7892" font-family="monospace" font-size="14">WHEN LASERS ARE ACTIVE</text>
	<rect x="870" y="270" width="260" height="58" rx="6" fill="#071a25" stroke="#5ee7ff"/>
	<line x1="890" y1="299" x2="934" y2="299" stroke="#5ee7ff" stroke-width="4"/>
	<circle cx="890" cy="299" r="5" fill="#ffffff"/>
	<text x="950" y="305" fill="#5ee7ff" font-family="monospace" font-size="20" font-weight="bold">LASER  19.8</text>

	<text x="870" y="388" fill="#6d7892" font-family="monospace" font-size="14">WHEN RAPID FIRE IS ACTIVE</text>
	<rect x="870" y="406" width="260" height="58" rx="6" fill="#211807" stroke="#ffcf5c"/>
	<g fill="none" stroke="#ffcf5c" stroke-width="3">
		<path d="M889 421 L905 435 L889 449"/><path d="M908 421 L924 435 L908 449"/>
	</g>
	<text x="940" y="441" fill="#ffcf5c" font-family="monospace" font-size="20" font-weight="bold">RAPID  19.8</text>

	<text x="870" y="530" fill="#9bb8d1" font-family="monospace" font-size="15">• one decimal second</text>
	<text x="870" y="560" fill="#9bb8d1" font-family="monospace" font-size="15">• text + icon, never color-only</text>
	<text x="870" y="590" fill="#9bb8d1" font-family="monospace" font-size="15">• hidden when no reward is active</text>
	<text x="870" y="650" fill="#6d7892" font-family="monospace" font-size="14">Concept only — no production</text>
	<text x="870" y="672" fill="#6d7892" font-family="monospace" font-size="14">geometry or visual assertions yet.</text>
</svg>
